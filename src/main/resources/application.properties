# Application name
spring.application.name=knowledger
# Active profile for the application
spring.profiles.active=luis.goes
# Flyway configuration
# Locations for Flyway migrations, including schema and data migrations
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data
# Enable Flyway migrations
spring.flyway.enabled=true
# Set baseline on migrate to true, allowing Flyway to create a baseline for an existing database with migrations
spring.flyway.baseline-on-migrate=true
# JWT (JSON Web Token) configuration
# Secret key for signing the JWT
jwt.secret=@KPL&L3tF?sadE23a&L5!nU2B!Rsd3_
# JWT expiration time in milliseconds (86400000 ms = 1 day)
jwt.expiration=86400000
# JPA and Hibernate configuration
# Database dialect for PostgreSQL, used by Hibernate to generate SQL optimized for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Setting ddl-auto to 'none' to disable schema generation; expects the database schema to be managed manually
spring.jpa.hibernate.ddl-auto=none
# Show SQL statements generated by Hibernate
spring.jpa.show-sql=true
# Format SQL statements output by Hibernate for readability
spring.jpa.properties.hibernate.format_sql=true
# Additional configuration location for environment-specific profiles
spring.config.additional-location=classpath:/profiles/
# Directory for storing uploaded post files
postFilesFolder=src/main/resources/postFiles
# Multipart file upload configuration
# Maximum file size for an individual file upload
spring.servlet.multipart.max-file-size=10MB
# Maximum total request size for multipart requests
spring.servlet.multipart.max-request-size=10MB