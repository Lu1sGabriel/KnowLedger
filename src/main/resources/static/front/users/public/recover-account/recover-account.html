<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Account</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.0.0/mdb.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css">

</head>

<body>
<!-- MDB -->
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.0.0/mdb.umd.min.js">
</script>


<section class="vh-100">
    <div class="container-fluid">
        <div class="row">

            <div class="col-sm-6 px-0 d-none d-sm-block">
                <img src="../../../assets/public/female-hands-writing.png" alt="Login image" class="w-100 vh-100">
            </div>

            <div class="col-sm-6 text-black">

                <div class="d-flex justify-content-center align-items-center mt-5">
                    <img src="../../../assets/public/knowledger-logo.png" alt="knowledger-logo" class="logo-center">
                </div>

                <div class="d-flex align-items-center h-custom-2 px-5 ms-xl-4 mt-5 pt-5 pt-xl-0 mt-xl-n5" style="display: flex; align-items: center; justify-content: center;text-align: center;">

                    <form id="loginForm" style="width: 23rem;">

                        <h2 class="fw-normal mb-3 pb-3">Recuperar conta</h2>
                        <p style="font-size: 14px;">Recupere a sua conta</p>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="password" id="password" class="form-control form-control-lg" />
                            <label class="form-label" for="password">Senha</label>
                        </div>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="password" id="" class="form-control form-control-lg" />
                            <label class="form-label" for="password">Senha</label>
                        </div>

                        <div class="pt-1 mb-4">
                            <button id="loginButton" data-mdb-button-init data-mdb-ripple-init class="btn btn-info btn-lg btn-block" type="button">Enviar</button>
                        </div>

                        <p>Já possui uma conta? <a href="/registerter.html" class="link-info">Acessar sua conta</a></p>

                    </form>

                </div>

            </div>

        </div>
    </div>
</section>

<script src="recover-account.js"></script>

</body>

</html>
