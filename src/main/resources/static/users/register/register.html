<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Registro</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.0.0/mdb.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css">

</head>

<body>
<!-- MDB -->
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.0.0/mdb.umd.min.js"></script>

<section class="vh-100">
    <div class="container-fluid">
        <div class="row">

            <div class="col-sm-6 px-0 d-none d-sm-block">
                <img src="../assets/register-image.png" alt="Register image" class="w-100 vh-100">
            </div>

            <div class="col-sm-6 text-black">

                <div class="d-flex justify-content-center align-items-center mt-5">
                    <img src="../assets/knowledger-logo.png" alt="knowledger-logo" class="logo-center">
                </div>

                <div class="d-flex align-items-center h-custom-2 px-5 ms-xl-4 mt-5 pt-5 pt-xl-0 mt-xl-n5"
                     style="display: flex; align-items: center; justify-content: center;text-align: center;">

                    <form id="registerForm" style="width: 23rem;">

                        <h2 class="fw-normal mb-3 pb-3">Crie sua conta</h2>
                        <p style="font-size: 14px;">Venha gerir o conhecimento da sua empresa!</p>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="text" id="name" class="form-control form-control-lg" />
                            <label class="form-label" for="name">Nome</label>
                        </div>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="email" id="email" class="form-control form-control-lg" />
                            <label class="form-label" for="email">Email</label>
                        </div>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="password" id="password" class="form-control form-control-lg" />
                            <label class="form-label" for="password">Senha</label>
                        </div>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="password" id="confirmedPassword" class="form-control form-control-lg" />
                            <label class="form-label" for="confirmedPassword">Confirmar Senha</label>
                        </div>

                        <div class="pt-1 mb-4">
                            <button id="registerButton" class="btn btn-info btn-lg btn-block" type="button">Registrar</button>
                        </div>

                        <p>Já tem uma conta? <a href="/users/login/login.html" class="link-info">Acesse sua conta</a></p>

                    </form>

                </div>

            </div>

        </div>
    </div>
</section>

<script src="register.js"></script>

</body>

</html>
